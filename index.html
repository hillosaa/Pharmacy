<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صيدليات الدواء - فرع 1081</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="p-2 md:p-6 text-slate-800">

    <!-- Header -->
    <header class="bg-slate-900 text-white rounded-2xl p-4 mb-6 shadow-lg flex flex-wrap justify-between items-center gap-4 border-b-4 border-amber-400">
        <div class="flex items-center gap-3">
            <div class="bg-amber-400 text-slate-900 font-extrabold text-xl px-3 py-1 rounded-xl">1081</div>
            <div>
                <h1 class="text-xl font-bold flex items-center gap-2">صيدليات الدواء – فرع 1081 <span class="text-xs bg-emerald-600 px-2 py-0.5 rounded-full">ينبع الصناعية</span></h1>
                <p class="text-xs text-slate-400">منظومة متابعة التأمين المزمن ووصفتي ريفيل | الصرف المبكر وحجوزات الرواتب</p>
            </div>
        </div>
        <div class="flex items-center gap-2 flex-wrap text-sm">
            <button onclick="loadPatients()" class="bg-slate-800 hover:bg-slate-700 text-amber-400 px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1"><i class="fas fa-sync-alt"></i> تحديث</button>
            <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg flex items-center gap-1"><i class="fas fa-file-excel"></i> تصدير Excel</button>
        </div>
    </header>

    <!-- Stats Grid -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
            <div class="text-xs font-bold text-slate-500 mb-1">إجمالي الحالات</div>
            <div id="stat-total" class="text-2xl font-black text-slate-800">0</div>
        </div>
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
            <div class="text-xs font-bold text-slate-500 mb-1">نسبة التواصل</div>
            <div id="stat-contact-rate" class="text-2xl font-black text-blue-600">0%</div>
        </div>
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
            <div class="text-xs font-bold text-slate-500 mb-1">وصفتي ريفيل</div>
            <div id="stat-wasfaty" class="text-2xl font-black text-purple-600">0 ر.س</div>
        </div>
        <div class="bg-white p-4 rounded-xl border border-emerald-100 bg-emerald-50/30 shadow-sm text-center">
            <div class="text-xs font-bold text-emerald-700 mb-1">حجز راتب</div>
            <div id="stat-salary" class="text-2xl font-black text-emerald-600">0</div>
        </div>
        <div class="bg-white p-4 rounded-xl border border-amber-100 bg-amber-50/30 shadow-sm text-center">
            <div class="text-xs font-bold text-amber-700 mb-1">صرف إجازة مبكر</div>
            <div id="stat-vacation" class="text-2xl font-black text-amber-600">0</div>
        </div>
    </div>

    <!-- Add Patient Form -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-6">
        <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="fas fa-user-plus text-blue-600"></i> تسجيل مريض جديد للمتابعة وإعادة الصرف</h2>
        
        <form id="patientForm" onsubmit="savePatient(event)" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold mb-1">نوع المعاملة *</label>
                    <select id="type" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm" required>
                        <option value="تأمين مزمن (Chronic)">تأمين مزمن (Chronic)</option>
                        <option value="وصفتي ريفيل (Wasfaty)">وصفتي ريفيل (Wasfaty)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">اسم المريض / العميل *</label>
                    <input type="text" id="name" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm" placeholder="مثال: عبد الله سالم الحربي" required>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">رقم الهوية / الإقامة</label>
                    <input type="text" id="nationalId" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm" placeholder="10xxxxxxxxx">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">رقم الجوال *</label>
                    <input type="tel" id="phone" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm" placeholder="05xxxxxxxx" required>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">القيمة التقديرية (ريال)</label>
                    <input type="number" id="price" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm" placeholder="مثال: 250">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">رغبة العميل وحالة التواصل</label>
                    <select id="status" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm">
                        <option value="لا (قيد الانتظار لم يتم بعد)">لا (قيد الانتظار لم يتم بعد)</option>
                        <option value="تم التواصل - حجز ليوم الراتب">تم التواصل - حجز ليوم
